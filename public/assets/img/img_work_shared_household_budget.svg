<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">共有家計簿の登録フロー</title>
  <desc id="description">OCRで読み取った候補を人が確認・補正してから登録する流れの説明図です。実際の画面ではありません。</desc>
  <rect width="1600" height="1000" fill="#eef4ee"/>
  <g font-family="Noto Sans JP, Yu Gothic, sans-serif" fill="#193c31">
    <text x="120" y="142" font-size="24" letter-spacing="4">PERSONAL PROJECT / SHARED HOUSEHOLD BUDGET</text>
    <text x="120" y="245" font-size="64" font-weight="700">共有家計簿</text>
    <text x="120" y="310" font-size="30">入力する手間を、確認して直す操作へ。</text>
    <g fill="#fff" stroke="#b7ccbf" stroke-width="2">
      <rect x="120" y="398" width="400" height="260" rx="24"/>
      <rect x="600" y="398" width="400" height="260" rx="24"/>
      <rect x="1080" y="398" width="400" height="260" rx="24"/>
    </g>
    <g fill="#548069" font-size="24">
      <text x="160" y="457">01 / OCR</text>
      <text x="640" y="457">02 / REVIEW</text>
      <text x="1120" y="457">03 / SAVE</text>
    </g>
    <g font-size="42" font-weight="700">
      <text x="160" y="530">読み取り</text>
      <text x="640" y="530">確認・補正</text>
      <text x="1120" y="530">登録</text>
    </g>
    <g font-size="26">
      <text x="160" y="599">レシート・明細PDF</text>
      <text x="640" y="599">金額・商品・カテゴリ</text>
      <text x="1120" y="599">2人の収支を共有</text>
    </g>
    <g stroke="#548069" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M540 528h40m-14-12 14 12-14 12"/>
      <path d="M1020 528h40m-14-12 14 12-14 12"/>
    </g>
    <text x="120" y="755" font-size="28">利用後の改善：家賃などの繰り返す入力をテンプレート化</text>
    <text x="120" y="906" font-size="24" fill="#557165">登録フローの説明図 / 実際の画面ではありません</text>
  </g>
</svg>
