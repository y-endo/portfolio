name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check repository policy
        shell: bash
        run: |
          if git ls-files | grep -Eq '^(\.agents|\.codex)/'; then
            echo 'Error: local agent configuration must not be tracked.' >&2
            exit 1
          fi

          if git log "${{ github.event.pull_request.head.sha || github.sha }}" --format='%ae%n%ce' | grep -Evq '(@users\.noreply\.github\.com|@github\.com)$'; then
            echo 'Error: commit email addresses must use a GitHub noreply address.' >&2
            exit 1
          fi

          if git grep -aEq 'adobe:ns:meta|<x:xmpmeta' -- public; then
            echo 'Error: public assets must not contain XMP metadata.' >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
